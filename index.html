{background:var(--gd)}.danger{background:#fff0ed;color:#c65343}.yellow{background:#fff8dc;color:#9b8427}.outline{background:white;border:1px solid var(--line)}.small{padding:7px 10px}.connection{border-radius:11px;padding:10px 14px;margin-bottom:19px;font-size:12px;font-weight:700}.connection.ok{background:#eaf5e3;color:#508c2b}.connection.warn{background:#fff5db;color:#977725}.connection.info{background:#edf0e9;color:#6e7964}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card,.section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:var(--shadow)}.statlabel{font-size:11px;color:var(--muted);font-weight:700}.statvalue{font-size:28px;font-weight:900;margin-top:8px;letter-spacing:-1px}.statdesc{font-size:11px;color:var(--gd);margin-top:5px}.two{grid-template-columns:1.1fr .9fr}.section{margin-bottom:16px}.secthead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.secthead h2{font-size:16px;margin:0}.muted{color:var(--muted)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}th{text-align:left;color:#929b89;font-size:10px;padding:11px 9px;border-bottom:1px solid var(--line)}td{padding:13px 9px;border-bottom:1px solid #f0f2ec}tr:last-child td{border:0}.pill{display:inline-flex;padding:5px 9px;border-radius:20px;background:#edf5e5;color:#568e35;font-size:10px;font-weight:800}.pill.gray{background:#f0f1ed;color:#747b6c}.pill.yellow{background:#fff8dc;color:#9b8427}.pill.red{background:#fff0ed;color:#c65343}.actions{display:flex;gap:5px}.actions button{padding:6px 9px;border-radius:8px;background:#f2f4ee;color:#65705e;font-size:11px;font-weight:700}.actions button:hover{background:#e8efdf}.membercell{display:flex;align-items:center;gap:9px}.miniavatar{width:31px;height:31px;border-radius:10px;background:#eaf3df;color:#57972d;display:grid;place-items:center;font-weight:900}.progress{height:7px;border-radius:10px;background:#edf0e9;overflow:hidden;margin-top:7px;min-width:80px}.progress i{display:block;height:100%;background:var(--g);border-radius:10px}.empty{text-align:center;padding:28px;color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none;width:100%;font-size:12px}.search{width:220px}.field{margin:0 0 13px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:6px}.field textarea{min-height:75px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--g)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.modalbg{position:fixed;inset:0;background:#10170f88;z-index:20;display:grid;place-items:center;padding:18px}.modal{background:white;width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:23px;box-shadow:0 25px 80px #0003}.modal h2{margin:0 0 17px;font-size:19px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{background:white;border:1px solid var(--line);border-radius:22px;padding:35px;width:min(390px,100%);text-align:center;box-shadow:var(--shadow)}.loginlogo{font-size:38px;font-weight:900;letter-spacing:-2px}.loginlogo span{color:var(--g)}.loginbox p{color:var(--muted);font-size:12px;line-height:1.8;margin:8px 0 24px}.mobile{display:none}.toast{position:fixed;bottom:22px;right:22px;z-index:60;background:#20251e;color:#fff;padding:12px 16px;border-radius:11px;font-size:12px;box-shadow:var(--shadow)}.rankcard{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;margin:8px 0}.rankleft{display:flex;align-items:center;gap:12px}.ranklevel{width:36px;height:36px;border-radius:11px;background:#f0f6e9;color:#57972d;display:grid;place-items:center;font-weight:900}.notice{background:#fbfcf8;border:1px dashed #dce5d2;border-radius:12px;padding:13px;color:#687263;font-size:11px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{background:#fafbf8;border:1px solid var(--line);border-radius:10px;min-height:75px;padding:7px;font-size:11px}.day.today{border-color:var(--g);background:#f5faef}.day .date{font-weight:900}.dayevent{margin-top:5px;background:#eaf4e2;color:#4f8d2b;border-radius:5px;padding:3px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px}.gameoverlay{position:fixed;inset:0;background:#111c;z-index:40;display:grid;place-items:center;padding:18px}.gamebox{width:min(850px,100%);background:#fff;border-radius:18px;padding:22px}.gamecanvas{width:100%;height:220px;border:1px solid var(--line);border-radius:10px;background:#fbfcf8}.gamehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.gameinfo{text-align:center;color:var(--muted);font-size:11px;margin:10px}.gamecontrols{display:flex;justify-content:center;gap:10px;align-items:center}.settingsrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
@media(max-width:1050px){.main{padding:24px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:720px){.sidebar{transform:translateX(-105%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin:0;padding:17px 13px}.mobile{display:inline-flex}.top h1{font-size:20px}.userbox span{display:none}.stats{gap:9px}.card{padding:14px}.statvalue{font-size:23px}.section{padding:14px}.search{width:100%}.formgrid{grid-template-columns:1fr}.calendar{gap:3px}.day{min-height:62px;padding:4px}}

<script>
'use strict';
/* 1) Firebase Console > 프로젝트 설정 > 웹 앱에서 아래 설정값을 입력하세요. */
const firebaseConfig = {apiKey: "AIzaSyDudVMU9naVRRZJolbn7aK5mE32qNB1wrg",authDomain: "ieummmmm.firebaseapp.com",projectId: "ieummmmm",storageBucket: "ieummmmm.firebasestorage.app",messagingSenderId: "1034433552330",appId: "1:1034433552330:web:e99cc9c5b2ff1022eb3933",measurementId: "G-4WWMZHN9TW"};
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={members:'멤버',ranks:'직급',tasks:'업무',projects:'프로젝트',revenue:'수익',schedules:'일정',announcements:'공지'};
const collections=['members','ranks','tasks','projects','revenue','schedules','announcements'];
const state={user:null,page:'dashboard',search:'',filter:'전체',month:new Date().getMonth(),year:new Date().getFullYear(),demo:true,connected:false,db:null,auth:null,unsubs:[],data:{members:[],ranks:[],tasks:[],projects:[],revenue:[],schedules:[],announcements:[]}};
const demo={ranks:[{id:'r-founder',name:'Founder',level:6,description:'창립 및 최종 운영 책임',color:'#e8c84a',permissions:'전체 관리',locked:true},{id:'r-exec',name:'Executive',level:5,description:'조직 및 프로젝트 총괄',color:'#8a72c8'},{id:'r-manager',name:'Manager',level:4,description:'팀과 업무 관리',color:'#5b9bd5'},{id:'r-official',name:'Official Member',level:3,description:'정식 소속 멤버',color:'#65a84b'},{id:'r-active',name:'Active Member',level:2,description:'활동 회원',color:'#77b96b'},{id:'r-member',name:'Member',level:1,description:'일반 회원',color:'#9aa393'}],members:[{id:'m-marst',name:'Marst',email:'',rank:'Founder',position:'CEO',department:'Management',responsibilities:'기획 및 전체 운영',status:'활동',joinedAt:'2026-08-01'},{id:'m-nex',name:'NEX',email:'',rank:'Developer',position:'Developer',department:'Development',responsibilities:'개발 및 프로젝트 참여',status:'활동',joinedAt:'2026-08-01'},{id:'m-duo',name:'Duo',email:'',rank:'Member',position:'Member',department:'Development',responsibilities:'프로젝트 지원',status:'휴면',joinedAt:'2026-08-01'}],tasks:[{id:'t1',title:'IEUM 홈페이지 개발',assignee:'m-marst',project:'p1',status:'진행 중',priority:'높음',deadline:'2026-11-20',description:'메인 페이지 및 멤버 기능'},{id:'t2',title:'서비스 홍보',assignee:'m-nex',project:'p2',status:'대기',priority:'보통',deadline:'2026-11-25',description:''},{id:'t3',title:'데이터베이스 설계',assignee:'m-marst',project:'p1',status:'보류',priority:'높음',deadline:'2026-11-15',description:''}],projects:[{id:'p1',name:'IEUM Organization Manager',manager:'m-marst',progress:35,status:'진행 중',startDate:'2026-11-01',deadline:'2026-12-01',description:'조직 관리 시스템'},{id:'p2',name:'IEUM Website',manager:'m-nex',progress:70,status:'진행 중',startDate:'2026-10-01',deadline:'2026-12-15',description:'공식 웹사이트'}],revenue:[],schedules:[{id:'s1',title:'IEUM 주간 회의',date:'2026-11-08',time:'20:00',type:'회의',description:'주간 업무 점검'}],announcements:[{id:'a1',title:'IEUM Manager 시작',body:'업무와 일정을 한곳에서 관리합니다.',createdAt:new Date().toISOString()}]};
function clone(v){return JSON.parse(JSON.stringify(v))}function toast(s){let e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),2600)}function money(n){return Number(n||0).toLocaleString('ko-KR')+'원'}function memberName(id){return state.data.members.find(m=>m.id===id)?.name||'미지정'}function projectName(id){return state.data.projects.find(p=>p.id===id)?.name||'—'}function statusPill(s){let c=s==='완료'?'pill':s==='보류'?'pill yellow':s==='진행 중'?'pill':'pill gray';return `<span class="${c}">${esc(s||'대기')}</span>`}function empty(s){return `<div class="empty">${esc(s)}</div>`}function dateToday(){return new Date().toISOString().slice(0,10)}
function useDemo(msg='데모 모드',reset=false){state.demo=true;state.connected=false;state.user={displayName:'IEUM Demo',email:'demo@ieum.local',uid:'demo'};let saved=null;if(!reset){try{saved=JSON.parse(localStorage.getItem('ieum_manager_local_v2')||'null')}catch(e){}}state.data=saved&&saved.data? saved.data:clone(demo);if(reset){localStorage.removeItem('ieum_manager_local_v2');state.data=clone(demo)}render();toast(msg)}
function persistDemo(){if(state.demo){try{localStorage.setItem('ieum_manager_local_v2',JSON.stringify({data:state.data,updatedAt:new Date().toISOString()}))}catch(e){console.warn('Local save failed',e)}}}
function initFirebase(){if(!FIREBASE_CONFIG.apiKey||FIREBASE_CONFIG.apiKey==='YOUR_API_KEY'||!window.firebase){useDemo('Firebase 설정 전 · 데모 데이터 사용 중');return}try{firebase.initializeApp(FIREBASE_CONFIG);state.auth=firebase.auth();state.db=firebase.firestore();state.auth.onAuthStateChanged(async user=>{state.user=user;if(user){state.demo=false;subscribeAll();}else{stopSubs();state.connected=false;render();}}); }catch(e){console.error(e);useDemo('Firebase 초기화 실패 · 데모 모드')}}
function stopSubs(){state.unsubs.forEach(fn=>{try{fn()}catch(e){}});state.unsubs=[]}
function subscribeAll(){stopSubs();collections.forEach(key=>{const unsub=state.db.collection(key).onSnapshot(snap=>{state.data[key]=snap.docs.map(d=>({id:d.id,...d.data()}));state.connected=true;state.demo=false;render()},err=>{console.error(key,err);state.connected=false;toast(key+' 읽기 권한 오류');render()});state.unsubs.push(unsub)});}
async function save(key,id,payload){if(state.demo){let arr=state.data[key];if(id){let i=arr.findIndex(x=>x.id===id);if(i>=0)arr[i]={...arr[i],...payload}}else arr.unshift({id:key+'-'+Date.now(),...payload,createdAt:new Date().toISOString()});persistDemo();render();toast('브라우저에 저장했어');return}try{if(id)await state.db.collection(key).doc(id).set({...payload,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});else await state.db.collection(key).add({...payload,createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});toast('저장 완료')}catch(e){alert('저장 실패: '+e.message)}}
async function remove(key,id){if(!confirm('정말 삭제할까?'))return;if(state.demo){state.data[key]=state.data[key].filter(x=>x.id!==id);persistDemo();render();toast('브라우저 데이터 삭제 완료');return}try{await state.db.collection(key).doc(id).delete();toast('삭제 완료')}catch(e){alert('삭제 실패: '+e.message)}}
async function login(){if(!state.auth){toast('Firebase 설정값을 먼저 입력해 줘');return}try{await state.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){alert('로그인 실패: '+e.message)}}async function logout(){if(state.auth)await state.auth.signOut();else{state.user=null;render()}}
const menus=[['dashboard','대시보드','▦'],['members','멤버 관리','♙'],['organization','조직도','⌘'],['tasks','업무 관리','☷'],['projects','프로젝트','▤'],['ranks','직급·권한','♛'],['schedules','일정·회의','▦'],['revenue','수익 관리','₩'],['announcements','공지사항','✦'],['settings','설정·백업','⚙']];
function sidebar(){return `<aside class="sidebar" id="sidebar"><div class="brand">IEUM<span>.</span><small>ORGANIZATION MANAGER</small></div><div class="navlabel">WORKSPACE</div>${menus.map(([id,label,ico])=>`<button class="nav ${state.page===id?'active':''}" data-page="${id}"><span class="ico">${ico}</span>${label}</button>`).join('')}<div class="sidebottom"><b>IEUM Organization</b><br>Internal Management System<br>Single-file edition · 2.0</div></aside>`}
function dashboard(){let d=state.data,t=d.tasks,done=t.filter(x=>x.status==='완료').length,active=t.filter(x=>x.status==='진행 중').length,blocked=t.filter(x=>x.status==='보류').length,total=d.revenue.reduce((a,x)=>a+Number(x.amount||0),0);return `<div class="grid stats">${[['전체 멤버',d.members.length,'등록된 구성원'],['전체 업무',t.length,'할당된 업무'],['진행 중',active,'현재 수행 중'],['완료율',t.length?Math.round(done/t.length*100)+'%':'0%',done+'개 완료']].map(x=>`<div class="card"><div class="statlabel">${x[0]}</div><div class="statvalue">${x[1]}</div><div class="statdesc">${x[2]}</div></div>`).join('')}</div><div class="grid two"><section class="section"><div class="secthead"><h2>최근 업무</h2><button class="btn small" data-page="tasks">전체 보기</button></div>${t.length?`<div class="tablewrap"><table><thead><tr><th>업무</th><th>담당자</th><th>마감</th><th>상태</th></tr></thead><tbody>${t.slice(0,6).map(x=>`<tr><td><b>${esc(x.title)}</b><div class="muted">${esc(projectName(x.project))}</div></td><td>${esc(memberName(x.assignee))}</td><td>${esc(x.deadline||'—')}</td><td>${statusPill(x.status)}</td></tr>`).join('')}</tbody></table></div>`:empty('업무가 없어.')} </section><section class="section"><div class="secthead"><h2>프로젝트 진행 현황</h2><button class="btn small" data-page="projects">전체 보기</button></div>${d.projects.length?d.projects.map(p=>`<div style="margin:13px 0"><div style="display:flex;justify-content:space-between;gap:8px;font-size:12px"><b>${esc(p.name)}</b><b>${Number(p.progress||0)}%</b></div><div class="progress"><i style="width:${Math.max(0,Math.min(100,Number(p.progress)||0))}%"></i></div><div class="muted" style="font-size:10px;margin-top:4px">책임자 ${esc(memberName(p.manager))}</div></div>`).join(''):empty('프로젝트가 없어.')}</section></div><div class="grid two"><section class="section"><div class="secthead"><h2>확인 필요 업무</h2><span class="pill yellow">${blocked}개</span></div>${blocked?t.filter(x=>x.status==='보류').map(x=>`<div class="settingsrow"><b>${esc(x.title)}</b><span class="muted">${esc(memberName(x.assignee))}</span></div>`).join(''):empty('보류 중인 업무가 없어.')}</section><section class="section"><div class="secthead"><h2>재무 요약</h2><button class="btn small" data-page="revenue">상세</button></div><div class="statvalue">${money(total)}</div><div class="muted">등록된 총 수익</div></section></div><section class="section"><div class="secthead"><h2>공지사항</h2><button class="btn small" data-page="announcements">모두 보기</button></div>${d.announcements.slice(0,3).map(a=>`<div class="settingsrow"><div><b>${esc(a.title)}</b><div class="muted">${esc(a.body||'')}</div></div><span class="muted">${esc((a.createdAt||'').slice(0,10))}</span></div>`).join('')||empty('공지사항이 없어.')}</section>`}
function membersPage(){let q=state.search.toLowerCase(),list=state.data.members.filter(m=>(m.name||'').toLowerCase().includes(q)||(m.email||'').toLowerCase().includes(q)||(m.position||'').toLowerCase().includes(q)||(m.department||'').toLowerCase().includes(q));return `<section class="section"><div class="secthead"><h2>멤버 관리 <span class="muted">${list.length}명</span></h2><div class="toolbar"><input class="search" id="search" placeholder="이름·이메일·직책 검색" value="${esc(state.search)}"><button class="btn primary" data-add="members">+ 멤버 추가</button></div></div><div class="tablewrap">${list.length?`<table><thead><tr><th>멤버</th><th>등급</th><th>직책</th><th>부서</th><th>상태</th><th>담당 업무</th><th>관리</th></tr></thead><tbody>${list.map(m=>`<tr><td><div class="membercell"><div class="miniavatar">${esc((m.name||'?')[0])}</div><div><b>${esc(m.name)}</b><div class="muted">${esc(m.email||'')}</div></div></div></td><td><span class="pill">${esc(m.rank||'Member')}</span></td><td>${esc(m.position||'—')}</td><td>${esc(m.department||'—')}</td><td>${statusPill(m.status||'활동')}</td><td>${esc(m.responsibilities||'—')}</td><td><div class="actions"><button data-edit="members" data-id="${esc(m.id)}">수정</button><button data-delete="members" data-id="${esc(m.id)}">삭제</button></div></td></tr>`).join('')}</tbody></table>`:empty('검색 결과가 없어.')}</div></section>`}
function organization(){let groups=[...new Set(state.data.members.map(m=>m.department||'미지정'))];return `<section class="section"><div class="secthead"><h2>조직도</h2><span class="pill">${state.data.members.length} Members</span></div>${groups.length?groups.map(g=>`<h3 style="color:var(--gd);font-size:13px;margin:20px 0 10px">${esc(g)}</h3><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">${state.data.members.filter(m=>(m.department||'미지정')===g).map(m=>`<div class="card"><div class="membercell"><div class="miniavatar">${esc((m.name||'?')[0])}</div><div><b>${esc(m.name)}</b><div class="muted">${esc(m.rank||'Member')} · ${esc(m.position||'—')}</div></div></div><div class="muted" style="font-size:11px;margin-top:12px">${esc(m.responsibilities||'담당 업무 미등록')}</div></div>`).join('')}</div>`).join(''):empty('구성원이 없어.')}</section>`}
function tasksPage(){let list=state.data.tasks.filter(t=>state.filter==='전체'||t.status===state.filter);return `<section class="section"><div class="secthead"><h2>업무 관리 <span class="muted">${list.length}건</span></h2><div class="toolbar"><select class="search" id="filter" style="width:140px"><option>전체</option>${['대기','진행 중','완료','보류'].map(s=>`<option ${state.filter===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn primary" data-add="tasks">+ 업무 등록</button></div></div><div class="tablewrap">${list.length?`<table><thead><tr><th>업무명</th><th>담당자</th><th>프로젝트</th><th>우선순위</th><th>마감일</th><th>상태</th><th>관리</th></tr></thead><tbody>${list.map(t=>`<tr><td><b>${esc(t.title)}</b><div class="muted">${esc(t.description||'')}</div></td><td>${esc(memberName(t.assignee))}</td><td>${esc(projectName(t.project))}</td><td>${t.priority==='높음'?'<span class="pill red">높음</span>':esc(t.priority||'보통')}</td><td>${esc(t.deadline||'—')}</td><td>${statusPill(t.status)}</td><td><div class="actions"><button data-edit="tasks" data-id="${esc(t.id)}">수정</button><button data-delete="tasks" data-id="${esc(t.id)}">삭제</button></div></td></tr>`).join('')}</tbody></table>`:empty('등록된 업무가 없어.')}</div></section>`}
function projectsPage(){return `<section class="section"><div class="secthead"><h2>프로젝트 관리</h2><button class="btn primary" data-add="projects">+ 프로젝트 추가</button></div>${state.data.projects.length?`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${state.data.projects.map(p=>`<div class="card"><div class="secthead"><b>${esc(p.name)}</b>${statusPill(p.status)}</div><div class="muted" style="font-size:11px">책임자 ${esc(memberName(p.manager))}</div><div style="font-size:22px;font-weight:900;margin-top:12px">${Number(p.progress||0)}%</div><div class="progress"><i style="width:${Math.max(0,Math.min(100,Number(p.progress)||0))}%"></i></div><div class="muted" style="font-size:10px;margin-top:10px">${esc(p.startDate||'—')} ~ ${esc(p.deadline||'—')}</div><p style="font-size:11px;color:#687263">${esc(p.description||'설명 없음')}</p><div class="actions"><button data-edit="projects" data-id="${esc(p.id)}">수정</button><button data-delete="projects" data-id="${esc(p.id)}">삭제</button></div></div>`).join('')}</div>`:empty('프로젝트가 없어.')}</section>`}
function ranksPage(){let ranks=[...state.data.ranks].sort((a,b)=>Number(b.level||0)-Number(a.level||0));return `<section class="section"><div class="secthead"><div><h2>IEUM 등급 체계</h2><div class="muted" style="font-size:11px">등급은 권한·책임 수준, 직책은 실제 담당 역할을 나타내.</div></div><button class="btn primary" data-add="ranks">+ 등급 추가</button></div>${ranks.length?ranks.map(r=>`<div class="rankcard"><div class="rankleft"><div class="ranklevel" style="background:${esc(r.color||'#edf5e5')};color:#fff">R${Number(r.level||0)}</div><div><b>${esc(r.name)}</b><div class="muted" style="font-size:11px">${esc(r.description||'설명 없음')} · ${state.data.members.filter(m=>m.rank===r.name).length}명</div><div class="muted" style="font-size:10px">권한: ${esc(r.permissions||'기본')}</div></div></div><div class="actions"><button data-edit="ranks" data-id="${esc(r.id)}">수정</button>${r.locked?'<span class="pill yellow">보호 등급</span>':`<button data-delete="ranks" data-id="${esc(r.id)}">삭제</button>`}</div></div>`).join(''):empty('등급을 추가해 줘.')}<div class="notice" style="margin-top:16px">등급 이름을 변경하면 기존 멤버의 등급 문자열은 자동 변경되지 않아. 멤버 관리에서 해당 멤버의 등급도 함께 변경해 줘.</div></section><section class="section"><div class="secthead"><h2>직책·부서 현황</h2></div>${[...new Set(state.data.members.map(m=>m.position).filter(Boolean))].map(p=>`<span class="pill" style="margin:3px">${esc(p)}</span>`).join('')||empty('등록된 직책이 없어.')}</section>`}
function revenuePage(){let rows=state.data.revenue,total=rows.reduce((a,r)=>a+Number(r.amount||0),0),expense=rows.filter(r=>r.kind==='지출').reduce((a,r)=>a+Number(r.amount||0),0),income=rows.filter(r=>r.kind!=='지출').reduce((a,r)=>a+Number(r.amount||0),0);return `<section class="section"><div class="secthead"><h2>수익·지출 관리</h2><button class="btn primary" data-add="revenue">+ 내역 등록</button></div><div class="grid stats" style="grid-template-columns:repeat(3,1fr)"><div class="card"><div class="statlabel">수입</div><div class="statvalue">${money(income)}</div></div><div class="card"><div class="statlabel">지출</div><div class="statvalue">${money(expense)}</div></div><div class="card"><div class="statlabel">순합계</div><div class="statvalue">${money(income-expense)}</div></div></div>${rows.length?`<div class="tablewrap"><table><thead><tr><th>유형</th><th>내용</th><th>프로젝트</th><th>금액</th><th>날짜</th><th>메모</th><th>관리</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.kind==='지출'?'<span class="pill red">지출</span>':'<span class="pill">수입</span>'}</td><td><b>${esc(r.title)}</b></td><td>${esc(r.projectName||'—')}</td><td>${money(r.amount)}</td><td>${esc(r.date||'—')}</td><td>${esc(r.memo||'')}</td><td><div class="actions"><button data-edit="revenue" data-id="${esc(r.id)}">수정</button><button data-delete="revenue" data-id="${esc(r.id)}">삭제</button></div></td></tr>`).join('')}</tbody></table></div>`:empty('등록된 수익·지출 내역이 없어.')}</section>`}
function schedulesPage(){let first=new Date(state.year,state.month,1),days=new Date(state.year,state.month+1,0).getDate(),offset=first.getDay(),events=state.data.schedules;let cells='';for(let i=0;i<offset;i++)cells+='<div></div>';for(let d=1;d<=days;d++){let date=`${state.year}-${String(state.month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,ev=events.filter(x=>x.date===date);cells+=`<div class="day ${date===dateToday()?'today':''}"><div class="date">${d}</div>${ev.map(e=>`<div class="dayevent" title="${esc(e.title)}">${esc(e.time||'')} ${esc(e.title)}</div>`).join('')}</div>`}return `<section class="section"><div class="secthead"><h2>일정·회의</h2><div class="toolbar"><button class="btn small" id="prevMonth">←</button><b>${state.year}년 ${state.month+1}월</b><button class="btn small" id="nextMonth">→</button><button class="btn primary" data-add="schedules">+ 일정 등록</button></div></div><div class="calendar">${['일','월','화','수','목','금','토'].map(x=>`<div class="muted" style="text-align:center;font-weight:800">${x}</div>`).join('')}${cells}</div></section><section class="section"><div class="secthead"><h2>등록된 일정</h2></div>${events.length?`<div class="tablewrap"><table><thead><tr><th>일정</th><th>날짜</th><th>시간</th><th>종류</th><th>설명</th><th>관리</th></tr></thead><tbody>${[...events].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(e=>`<tr><td><b>${esc(e.title)}</b></td><td>${esc(e.date||'')}</td><td>${esc(e.time||'')}</td><td>${esc(e.type||'기타')}</td><td>${esc(e.description||'')}</td><td><div class="actions"><button data-edit="schedules" data-id="${esc(e.id)}">수정</button><button data-delete="schedules" data-id="${esc(e.id)}">삭제</button></div></td></tr>`).join('')}</tbody></table></div>`:empty('일정이 없어.')}</section>`}
function announcementsPage(){return `<section class="section"><div class="secthead"><h2>공지사항</h2><button class="btn primary" data-add="announcements">+ 공지 작성</button></div>${state.data.announcements.length?[...state.data.announcements].map(a=>`<div class="rankcard"><div><b>${esc(a.title)}</b><div class="muted" style="font-size:11px;white-space:pre-wrap">${esc(a.body||'')}</div><div class="muted" style="font-size:10px;margin-top:5px">${esc((a.createdAt||'').slice(0,10))}</div></div><div class="actions"><button data-edit="announcements" data-id="${esc(a.id)}">수정</button><button data-delete="announcements" data-id="${esc(a.id)}">삭제</button></div></div>`).join(''):empty('공지사항이 없어.')}</section>`}
function settingsPage(){return `<section class="section"><div class="secthead"><h2>데이터 관리</h2></div><div class="notice">현재 ${state.demo?'데모 모드':'Firebase 연결 모드'}야. JSON 백업은 모든 관리 데이터를 하나의 파일로 내보내고, 복원할 수 있어.</div><div class="settingsrow"><div><b>데이터 백업</b><div class="muted">현재 브라우저 데이터 전체를 JSON으로 저장</div></div><button class="btn primary" id="exportBtn">JSON 내보내기</button></div><div class="settingsrow"><div><b>데이터 복원</b><div class="muted">IEUM Manager 백업 JSON 불러오기</div></div><label class="btn" for="importFile">파일 선택</label><input id="importFile" type="file" accept="application/json" hidden></div><div class="settingsrow"><div><b>데모 데이터 초기화</b><div class="muted">현재 화면을 예시 데이터로 다시 설정</div></div><button class="btn yellow" id="resetDemo">데모 초기화</button></div><div class="settingsrow"><div><b>로그아웃</b><div class="muted">현재 Google 계정 연결 종료</div></div><button class="btn danger" id="logoutBtn">로그아웃</button></div></section><section class="section"><div class="secthead"><h2>Firebase 연결 안내</h2></div><ol style="font-size:12px;line-height:2;color:#687263"><li>Firebase Console에서 프로젝트와 Web App을 생성.</li><li>Authentication에서 Google 로그인 제공업체 활성화.</li><li>Firestore Database 생성.</li><li>HTML 상단의 <code>FIREBASE_CONFIG</code> 값을 실제 프로젝트 설정으로 교체.</li><li>아래 보안 규칙을 적용하고 웹 서버(예: localhost 또는 HTTPS)에서 실행.</li></ol><pre style="white-space:pre-wrap;background:#f6f8f3;padding:13px;border-radius:10px;font-size:11px;overflow:auto">rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() { return request.auth != null; }
    match /{document=**} {
      allow read, write: if signedIn();
    }
  }
}</pre><div class="notice">위 규칙은 로그인한 모든 사용자가 모든 데이터를 수정할 수 있는 기본 팀용 예시야. 실제 운영 전에는 관리자·멤버별 권한을 검증하는 규칙으로 강화해야 해. Firebase 웹 설정값은 비밀번호가 아니지만, Firestore 보안 규칙과 Authentication 설정은 반드시 필요해.</div></section>`}
const pages={dashboard,members:membersPage,organization,tasks:tasksPage,projects:projectsPage,ranks:ranksPage,schedules:schedulesPage,revenue:revenuePage,announcements:announcementsPage,settings:settingsPage};const titles={dashboard:'대시보드',members:'멤버 관리',organization:'조직도',tasks:'업무 관리',projects:'프로젝트 관리',ranks:'직급·권한',schedules:'일정·회의',revenue:'수익 관리',announcements:'공지사항',settings:'설정·백업'};
function render(){if(!state.user){$('app').innerHTML=`<div class="login"><div class="loginbox"><div class="loginlogo">IEUM<span>.</span></div><p>Organization Manager<br>조직과 업무를 연결합니다.</p><button class="btn primary" id="googleLogin" style="width:100%;padding:13px">Google 계정으로 로그인</button><div class="muted" style="font-size:11px;margin:13px 0">Firebase 설정이 완료된 경우에만 팀 동기화가 작동해.</div><button class="btn outline" id="demoLogin" style="width:100%">데모 모드로 둘러보기</button></div></div>`;$('googleLogin').onclick=login;$('demoLogin').onclick=()=>useDemo('데모 모드로 시작했어');return}let page=pages[state.page]||dashboard;$('app').innerHTML=`${sidebar()}<main class="main"><div class="top"><div class="toolbar"><button class="btn mobile" id="mobileMenu">☰</button><div><h1>${titles[state.page]}</h1><div class="sub">IEUM Organization Management System</div></div></div><div class="userbox"><div class="avatar">${esc((state.user.displayName||state.user.email||'U')[0])}</div><span>${esc(state.user.displayName||state.user.email||'사용자')}</span><button class="btn small" id="logoutTop">나가기</button></div></div><div class="connection ${state.connected?'ok':state.demo?'warn':'info'}">${state.connected?'● Firebase 연결됨 · Firestore 실시간 동기화':state.demo?'● 로컬 모드 · 데이터는 이 브라우저에 저장':'● Firebase 연결 중'}</div>${page()}<div id="modalRoot"></div></main>`;
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;state.search='';render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openForm(b.dataset.add));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(b.dataset.edit,b.dataset.id));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(b.dataset.delete,b.dataset.id));$('logoutTop').onclick=logout;$('mobileMenu')?.addEventListener('click',()=>$('sidebar').classList.toggle('open'));$('search')?.addEventListener('input',e=>{state.search=e.target.value;let p=e.target.selectionStart;render();$('search')?.focus();$('search')?.setSelectionRange(p,p)});$('filter')?.addEventListener('change',e=>{state.filter=e.target.value;render()});$('prevMonth')?.addEventListener('click',()=>{state.month--;if(state.month<0){state.month=11;state.year--}render()});$('nextMonth')?.addEventListener('click',()=>{state.month++;if(state.month>11){state.month=0;state.year++}render()});$('exportBtn')?.addEventListener('click',exportData);$('importFile')?.addEventListener('change',importData);$('resetDemo')?.addEventListener('click',()=>{if(confirm('현재 화면 데이터를 데모 데이터로 초기화할까?'))useDemo('데모 데이터 초기화 완료')});$('logoutBtn')?.addEventListener('click',logout)}
function field(label,name,value='',type='text',required=false,placeholder=''){return `<div class="field"><label>${label}${required?' *':''}</label><input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} placeholder="${esc(placeholder)}"></div>`}function textarea(label,name,value=''){return `<div class="field"><label>${label}</label><textarea name="${name}">${esc(value)}</textarea></div>`}function selectField(label,name,options,value=''){return `<div class="field"><label>${label}</label><select name="${name}">${options.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`}function memberOptions(){return [{value:'',label:'미지정'},...state.data.members.map(m=>({value:m.id,label:m.name}))]}function projectOptions(){return [{value:'',label:'미지정'},...state.data.projects.map(p=>({value:p.id,label:p.name}))]}
function openForm(type,id=null){let old=id?state.data[type].find(x=>x.id===id)||{}:{},title=id?'수정':'새로 등록',body='';if(type==='members'){let rankOpts=state.data.ranks.map(r=>({value:r.name,label:`${r.name} (R${r.level})`}));if(!rankOpts.length)rankOpts=[{value:'Member',label:'Member'}];body=`<div class="formgrid">${field('이름','name',old.name||'', 'text',true)}${field('이메일','email',old.email||'','email')}${selectField('등급','rank',rankOpts,old.rank||rankOpts[0].value)}${field('직책','position',old.position||'')}${field('부서','department',old.department||'')}${selectField('상태','status',['활동','휴면','탈퇴'].map(x=>({value:x,label:x})),old.status||'활동')}${field('가입일','joinedAt',old.joinedAt||dateToday(),'date')}</div>${textarea('담당 업무','responsibilities',old.responsibilities||'')}`}
if(type==='ranks'){body=`<div class="formgrid">${field('등급 이름','name',old.name||'', 'text',true)}${field('등급 레벨','level',old.level??1,'number',true)}${field('표시 색상','color',old.color||'#78bd43','color')}${field('권한 요약','permissions',old.permissions||'기본')}</div>${textarea('등급 설명','description',old.description||'')}`}
if(type==='tasks'){body=`${field('업무명','title',old.title||'', 'text',true)}<div class="formgrid">${selectField('담당자','assignee',memberOptions(),old.assignee||'')}${selectField('프로젝트','project',projectOptions(),old.project||'')}${selectField('상태','status',['대기','진행 중','완료','보류'].map(x=>({value:x,label:x})),old.status||'대기')}${selectField('우선순위','priority',['낮음','보통','높음','긴급'].map(x=>({value:x,label:x})),old.priority||'보통')}${field('마감일','deadline',old.deadline||'','date')}</div>${textarea('업무 설명','description',old.description||'')}`}
if(type==='projects'){body=`${field('프로젝트명','name',old.name||'', 'text',true)}<div class="formgrid">${selectField('책임자','manager',memberOptions(),old.manager||'')}${field('진행률 (%)','progress',old.progress??0,'number')}${selectField('상태','status',['준비','진행 중','완료','보류'].map(x=>({value:x,label:x})),old.status||'진행 중')}${field('시작일','startDate',old.startDate||dateToday(),'date')}${field('마감일','deadline',old.deadline||'','date')}</div>${textarea('설명','description',old.description||'')}`}
if(type==='revenue'){body=`${field('내용','title',old.title||'', 'text',true)}<div class="formgrid">${selectField('유형','kind',[{value:'수입',label:'수입'},{value:'지출',label:'지출'}],old.kind||'수입')}${field('금액 (원)','amount',old.amount??0,'number',true)}${field('프로젝트명','projectName',old.projectName||'')}${field('날짜','date',old.date||dateToday(),'date')}</div>${textarea('메모','memo',old.memo||'')}`}
if(type==='schedules'){body=`${field('일정명','title',old.title||'', 'text',true)}<div class="formgrid">${field('날짜','date',old.date||dateToday(),'date',true)}${field('시간','time',old.time||'','time')}${selectField('종류','type',['회의','마감','행사','기타'].map(x=>({value:x,label:x})),old.type||'회의')}</div>${textarea('설명','description',old.description||'')}`}
if(type==='announcements'){body=`${field('공지 제목','title',old.title||'', 'text',true)}${textarea('공지 내용','body',old.body||'')}`}
let modal=$('modalRoot');modal.innerHTML=`<div class="modalbg" id="modalBg"><form class="modal" id="dataForm"><h2>${title} · ${names[type]}</h2>${body}<div class="modalfoot"><button type="button" class="btn" id="cancel">취소</button><button type="submit" class="btn primary">저장하기</button></div></form></div>`;$('cancel').onclick=()=>modal.innerHTML='';$('modalBg').onclick=e=>{if(e.target.id==='modalBg')modal.innerHTML=''};$('dataForm').onsubmit=async e=>{e.preventDefault();let payload=Object.fromEntries(new FormData(e.target).entries());if(['level','progress','amount'].some(k=>k in payload))for(let k of ['level','progress','amount'])if(k in payload)payload[k]=Number(payload[k]||0);if(type==='ranks'&&old.locked)payload.locked=true;if(type==='announcements'&&!id)payload.createdAt=new Date().toISOString();await save(type,id,payload);modal.innerHTML='';};}
function exportData(){let blob=new Blob([JSON.stringify({format:'IEUM-Organization-Manager',version:2,exportedAt:new Date().toISOString(),data:state.data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='IEUM-backup-'+dateToday()+'.json';a.click();URL.revokeObjectURL(a.href);toast('백업 파일 생성 완료')}
async function importData(e){let file=e.target.files?.[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!obj.data)throw Error('IEUM 백업 파일이 아니야');if(!confirm('현재 데이터 대신 백업 데이터를 불러올까? Firebase 모드에서는 컬렉션별로 덮어써.'))return;for(let key of collections){let arr=Array.isArray(obj.data[key])?obj.data[key]:[];if(state.demo){state.data[key]=arr.map(x=>({...x}));persistDemo()}else{let batch=state.db.batch();let old=await state.db.collection(key).get();old.docs.forEach(d=>batch.delete(d.ref));arr.forEach(item=>{let {id,...payload}=item;let ref=id?state.db.collection(key).doc(String(id)):state.db.collection(key).doc();batch.set(ref,payload)});await batch.commit()}}if(state.demo){persistDemo();render()}toast('백업 복원 완료')}catch(err){alert('복원 실패: '+err.message)}finally{e.target.value=''}}
// Editing shortcuts intentionally open the built-in dinosaur mini-game instead of the edit form.
// Normal CRUD editing is available from the explicit Edit buttons in this edition.
initFirebase();
</script></body></html>
